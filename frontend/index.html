<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>

    <link rel="stylesheet" href="style.css">
    <script src="" defer></script>
</head>

<body>
    <div class="container-principal">

        <div id="titulo">
            <h1>Sistema de Demandas</h1>
            <p>Acompanhamento de Projetos</p>
        </div>


        <!--Campo de Email-->

        <div class="input-tela-login">
            <form>
                <label for="email">E-mail</label>
                <br>
                <input type="email" id="email" placeholder="sistemadedemanda@gmail.com">
            </form>
        </div>


        <!--Campo de Senha-->

        <div class="input-tela-login" id="id-senha">
            <label for="senha">Senha</label>
            <br>
            <input type="password" id="senha" placeholder="xxxxxxxxxx">
        </div>

        <div class="requerimento-senha">
            <ul>
                <li>Ao menos 1 letra maiuscula</li>
                <li>Ao Menos 1 letra minúscula</li>
                <li>Ao menos um número</li>
                <li>Ao menos 1 caractére especial: ! @ # _ *</li>
            </ul>
        </div>


        <!--Botao de Login-->

        <div class="input-tela-login">
            <form>
                <button type="submit" id="loginBtn">Entrar</button>
            </form>
        </div>
    </div>


</body>

</html>
