<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>

    <link rel="stylesheet" href="/PI-II-TIME-N3-2026/frontend/styles/tela_login.css">
</head>

<body>
    <form id="formulario">

        <div class="container-principal">

            <div id="titulo">
                <h1>Sistema de Demandas</h1>
                <p>Acompanhamento de Projetos</p>
            </div>

            <!--Campo de Email-->
            <div class="input-tela-login">
                <label for="email">E-mail</label>
                <br>
                <input type="email" id="email" placeholder="sistemadedemanda@gmail.com">
                <p id="mensagem_erro_email">Mensagem de Erro</p>
            </div>

            <!--Campo de Senha-->
            <div class="input-tela-login" id="id-senha">
                <label for="senha">Senha</label>
                <br>
                <input type="password" id="senha" placeholder="xxxxxxxxxx">
            </div>

            <div class="requerimento-senha" id="requerimentos">
                <ul>
                    <li id="req_espacos">Nao pode conter espaços ou estar vazia</li>
                    <li id="maiuscula">Ao menos 1 letra maiuscula</li>
                    <li id="minuscula">Ao Menos 1 letra minúscula</li>
                    <li id="numero">Ao menos um número</li>
                    <li id="c_especial">Ao menos 1 caractére especial: ! @ # _ * -</li>
                </ul>
            </div>

            <!--Botao de Login-->
            <div class="input-tela-login">
                <button type="submit" id="loginBtn" value="submit">Entrar</button>
            </div>
            <p id="forms_invalido">Mensagem de erro</p>
        </div>

    </form>

    <script src="/PI-II-TIME-N3-2026/frontend/scripts/tela_login.js"></script>
</body>

</html>
