<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listagem de Demandas</title>
  <link rel="stylesheet" href="ListagemDemandas.css">
  <script src="ListagemDemandas.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <nav class="logoeusuario">
      <p id="logo">Demandas <span>N3</span></p>
      <div class="usuario">
        <p id="avatar">GP</p>
        <p id="nome">Gustavo Pietro <small>Integrante</small></p>
      </div>
    </nav>
  </header>

  <div class="layout">

    <div class="barralateral">
      <div class="itens">
        <a href="dashboard.html">Dashboard</a>
        <a href="cadastro.html">Adicionar Demanda</a>
        <a href="ListagemDemandas.html" class="aberto">Listagem de Demandas</a>
        <a href="detalhes.html">Detalhes das Demandas</a>
        <a href="#">Projetos</a>
        <a href="#">Sair</a>
      </div>
    </div>

    <div class="pagina">
      <h1>Listagem de Demandas</h1>

      <div class="filtros">
        <input type="text" id="busca" placeholder="Buscar por título ou descrição">
        <select class="tipos" id="filtroStatus">
          <option value="">Status</option>
          <option>Aberta</option>
          <option>Em andamento</option>
          <option>Em revisão</option>
          <option>Concluída</option>
          <option>Cancelada</option>
        </select>

        <select class="tipos" id="filtroPrioridade">
          <option value="">Prioridade</option>
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
          <option>Crítica</option>
        </select>

        <select class="tipos" id="filtroTipo">
          <option value="">Tipo</option>
          <option>Tarefa</option>
          <option>Defeito</option>
          <option>Melhoria</option>
          <option>Documentação</option>
        </select>

       
        <select class="tipos" id="ordenar">
          <option value="">Ordenar por</option>
          <option value="dataCriacao">Data de criação</option>
          <option value="prazo">Prazo</option>
          <option value="prioridade">Prioridade</option>
          <option value="status">Status</option>
        </select>
 
        <button class="botaoNova" id="botaoNova">+ Nova demanda</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Tipo</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Projeto</th>
            <th>Responsável</th>
            <th>Data de criação</th>
            <th>Prazo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">

        </tbody>
      </table>

      <div class="paginacao">
        <span>Mostrando 1 - 5</span>
        <div>
          <button>&lt;</button>
          <button>&gt;</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
